<!doctype html><html><head><meta charset="utf-8"><title>gait</title><style>body{margin:0;background:#c9cfe0}svg{display:block}</style></head><body>
<svg id="s" width="1600" height="700" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg"><rect width="1600" height="700" fill="#b9c2da"/><rect y="330" width="1600" height="10" fill="#6d7694"/><rect y="670" width="1600" height="30" fill="#6d7694"/></svg>
<script src="../js/core.js"></script><script src="../js/items.js"></script><script src="../js/human.js"></script><script src="../js/crew.js"></script>
<script>
(function(){
const SW=window.SW,R=Math.PI/180,svg=document.getElementById('s'),q=new URLSearchParams(location.search);
const yaw=(+(q.get('yaw')||0))*R, N=8, sc=1.45;
[0,1].forEach((row)=>{
  for(let k=0;k<N;k++){
    const cr=SW.crew.create(SW.CREW_LOOK[row]);
    const w=document.createElementNS('http://www.w3.org/2000/svg','g');
    w.setAttribute('transform',`translate(${100+k*190} ${row?665:325}) scale(${sc})`);
    w.appendChild(cr.g);svg.appendChild(w);
    SW.crew.apply(cr,{yaw,theta:k/N*Math.PI*2,amp:1,carry:row===1,gy:row?100:null,gf:row?27:0,gl:15,lean:row?-8:0});
  }
});
window.__done=true;
})();
</script></body></html>
